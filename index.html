<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      touch-action: none;
    }

    /* 开始体验界面 */
    #startScreen {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.47);

      z-index: 9999;
    }

    /* 开始体验按钮 */
    #startButton {
      padding: 16px 32px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    /* 博物馆信息卡 */
    #infoPanel {
      /* 初始状态不显示 */
      display: none;
      position: fixed;
      left: 20px;
      bottom: 25px;
      max-width: 300px;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      border-radius: 10px;
      z-index: 5000;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }

    /* 文物名称 */
    .objectTitle {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    /* 文物基础信息 */
    .objectInfo {
      font-size: 14px;
      opacity: 0.9;
    }
  </style>

</head>


<body>
  <!-- 开始体验按钮：解锁音频播放权限 -->
  <div id="startScreen">
    <button id="startButton">
      开始体验
    </button>
  </div>

  <!-- 音频资源 -->
  <audio id="bgMusic" src="./background_music.mp3" preload="auto" loop>
  

  <audio id="narration" src="./narration_voice.mp3" preload="auto">
  

  <!-- 博物馆信息卡 -->
  <div id="infoPanel">
    <div class="objectTitle">
      商夔纹象尊
      俗称：子母象尊
    </div>

    <div class="objectInfo">
      约公元前 1100–1050 年<br>
      青铜｜青铜象尊<br>
      馆藏：美国弗利尔美术馆（Freer Gallery of Art）
    </div>
  </div>

  <!-- AR 场景 -->
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false">
    </a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- MODEL ROOT：控制模型整体位置与大小 -->
      <a-entity id="modelRoot" position="0 0 0.1" scale="3 3 3">

        <!-- 自动旋转节点 -->
        <a-entity id="spinRoot" animation="
          property: rotation;
          from: 0 0 0;
          to: 0 360 0;
          loop: true;
          dur: 10000;
          easing: linear">

          <!-- 3D 模型 -->
          <a-gltf-model src="./guang.glb" position="0 0 0" rotation="0 0 0">
          </a-gltf-model>

        </a-entity>

      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    /* ---------- 1. 获取页面元素 ---------- */
    const startScreen = document.querySelector("#startScreen");
    const startButton = document.querySelector("#startButton");
    const target = document.querySelector("#target");
    const bgMusic = document.querySelector("#bgMusic");
    const narration = document.querySelector("#narration");
    const infoPanel = document.querySelector("#infoPanel");
    const modelRoot = document.querySelector("#modelRoot");
    const spinRoot = document.querySelector("#spinRoot");

    /* ---------- 2. 设置音量 ---------- */
    bgMusic.volume = 0.8;
    narration.volume = 1.0;

    /* ---------- 3. 体验状态变量 ---------- */
    let experienceStarted = false;
    let targetVisible = false;
    let narrationFinished = false;
    // 直接开启手势交互权限，识别目标后即可操作
    let exploring = false;

    /* ---------- 4. 点击「开始体验」解锁音频 ---------- */
    startButton.addEventListener("click", async () => {
      try {
        /* 解锁背景音乐 */
        bgMusic.muted = true;
        await bgMusic.play();
        bgMusic.pause();
        bgMusic.currentTime = 0;
        bgMusic.muted = false;

        /* 解锁语音讲解 */
        narration.muted = true;
        await narration.play();
        narration.pause();
        narration.currentTime = 0;
        narration.muted = false;
      }
      catch (error) {
        console.log("Audio unlock:", error);
      }

      experienceStarted = true;
      startScreen.style.display = "none";

      /* 如果已经识别到目标，直接播放音频+开启交互 */
      if (targetVisible) {
        playAudio();
        infoPanel.style.display = "block";
        // 识别到目标直接开启手势、停止自转
        enableGestureControl();
      }
    });

    /* ---------- 5. 播放音频 ---------- */
    function playAudio() {
      if (!experienceStarted) return;

      bgMusic.play().catch((error) => {
        console.log("Background music error:", error);
      });

      if (!narrationFinished) {
        narration.play().catch((error) => {
          console.log("Narration error:", error);
        });
      }
    }

    /* ---------- 6. 识别到目标 ---------- */
    target.addEventListener("targetFound", () => {
      console.log("🎯 TARGET FOUND");
      targetVisible = true;

      playAudio();

      if (experienceStarted) {
        infoPanel.style.display = "block";
        // 核心：识别到目标直接开启手势操作，不需要点按钮
        enableGestureControl();
      }
    });

    /* ---------- 7. 目标丢失 ---------- */
    target.addEventListener("targetLost", () => {
      console.log("TARGET LOST");
      targetVisible = false;

      bgMusic.pause();
      narration.pause();
      infoPanel.style.display = "none";
    });

    /* ---------- 8. 讲解结束回调 ---------- */
    narration.addEventListener("ended", () => {
      narrationFinished = true;
      console.log("🔊 Narration Finished");
    });

    /* ---------- 新增：开启手势控制 + 停止自动旋转 ---------- */
    function enableGestureControl() {
      // 防止重复执行
      if (exploring) return;
      exploring = true;
      stopAutoRotation();
      console.log("🖐️ Gesture Interaction Enabled");
    }

    /* ---------- 停止自动旋转 ---------- */
    function stopAutoRotation() {
      // 读取当前旋转角度，避免跳变
      currentRotationY = THREE.MathUtils.radToDeg(
        spinRoot.object3D.rotation.y
      );

      // 移除自动旋转动画
      spinRoot.removeAttribute("animation");

      // 保持当前角度
      spinRoot.setAttribute("rotation", `0 ${currentRotationY} 0`);
    }

    /* =========================================================
       3D 模型手势控制（核心逻辑保持不变）
       ========================================================= */
    let currentScale = modelRoot.getAttribute("scale").x;
    let currentRotationY = 0;
    const initialScale = currentScale;
    const minScale = initialScale * 0.5;
    const maxScale = initialScale * 7.0;

    function setModelScale(scale) {
      currentScale = Math.max(minScale, Math.min(maxScale, scale));
      modelRoot.setAttribute(
        "scale",
        `${currentScale} ${currentScale} ${currentScale}`
      );
    }

    const activePointers = new Map();
    let lastSingleX = null;
    let pinchStartDistance = null;
    let pinchStartScale = currentScale;

    function getPointerDistance() {
      const points = Array.from(activePointers.values());
      if (points.length < 2) return 0;
      const dx = points[0].x - points[1].x;
      const dy = points[0].y - points[1].y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    /* 按下 */
    document.addEventListener("pointerdown", (event) => {
      if (!exploring) return;
      if (
        event.target.closest &&
        event.target.closest("#startScreen, #infoPanel")
      ) {
        return;
      }

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size === 1) {
        lastSingleX = event.clientX;
      }

      if (activePointers.size === 2) {
        pinchStartDistance = getPointerDistance();
        pinchStartScale = currentScale;
        lastSingleX = null;
      }
    });

    /* 移动 */
    document.addEventListener("pointermove", (event) => {
      if (!exploring || !activePointers.has(event.pointerId)) return;

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      // 单指/鼠标拖动：旋转
      if (activePointers.size === 1 && lastSingleX !== null) {
        const dx = event.clientX - lastSingleX;
        currentRotationY += dx * 0.4;
        spinRoot.setAttribute("rotation", `0 ${currentRotationY} 0`);
        lastSingleX = event.clientX;
      }

      // 双指捏合：缩放
      if (activePointers.size === 2 && pinchStartDistance) {
        event.preventDefault();
        const newDistance = getPointerDistance();
        const ratio = newDistance / pinchStartDistance;
        setModelScale(pinchStartScale * ratio);
      }
    }, { passive: false });

    /* 抬起/取消 */
    function endPointer(event) {
      activePointers.delete(event.pointerId);
      if (activePointers.size === 1) {
        const remainingPointer = Array.from(activePointers.values())[0];
        lastSingleX = remainingPointer.x;
      } else {
        lastSingleX = null;
      }
      if (activePointers.size < 2) {
        pinchStartDistance = null;
      }
    }

    document.addEventListener("pointerup", endPointer);
    document.addEventListener("pointercancel", endPointer);

    /* 鼠标滚轮缩放 */
    document.addEventListener("wheel", (event) => {
      if (!exploring) return;
      event.preventDefault();
      if (event.deltaY < 0) {
        setModelScale(currentScale * 1.10);
      } else {
        setModelScale(currentScale * 0.90);
      }
    }, { passive: false });

  </script>

</body>

</html>
